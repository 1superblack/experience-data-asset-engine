name: ci

# 只做一件事：证明「干净机器上装得起来、测得过、包打得出来」。
# 这里不写徽章、不写「已验证通过」之类字样——状态由 GitHub 上的真实运行结果说话。

on:
  push:
    # 功能分支也要跑：只挂 main/master 的话，push 到 feature/* 不会触发，等于没门禁。
    branches: [main, master, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 默认代码页不是 UTF-8：子进程里的中文输出会变成乱码，断言按 UTF-8 读就会红。
# 这里在 workflow 级别固定，三个 job 一致；测试自身也给子进程注入同一组变量（双保险）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: py${{ matrix.python }} / dev+codex
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（dev + codex，含 zstandard）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,codex]"

      # 覆盖率必须由 `coverage run` 产生数据文件后，`coverage report` 才有东西可读；
      # 所以这里是「一次运行同时出测试结果和覆盖率」，而不是先裸跑 pytest 再 report
      # （那样 report 只会报 No data to report）。
      #
      # 装了 codex extra 后，唯一允许的 skip 是 2 条只在 Windows 代码页下成立的编码回归。
      # 其它 skip 仍判失败，避免 `.jsonl.zst` 等真实路径没跑却显示全绿。
      - name: 单元测试 + 覆盖率（分支，阈值 85%，仅允许 Windows-only skip）
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run -m pytest -q --cache-clear -rs 2>&1 | tee pytest-with-zstd.log
          python -m coverage report --fail-under=85
          if ! grep -Eq '[0-9]+ passed, 2 skipped' pytest-with-zstd.log; then
            echo "::error::dev+codex 环境应只有 2 条 Windows-only 编码测试 skip。"
            tail -n 30 pytest-with-zstd.log
            exit 1
          fi
          unexpected_skips="$(grep -E '^SKIPPED' pytest-with-zstd.log | grep -Fv 'tests/test_cli_encoding.py' || true)"
          if [ -n "${unexpected_skips}" ]; then
            echo "::error::dev+codex 环境出现了 Windows 编码回归之外的 skip。"
            echo "${unexpected_skips}"
            exit 1
          fi

      - name: 静态检查（未定义名称 / 语法错误 / 未使用导入）
        run: ruff check --select F,E9 src scripts tests

      - name: Skill 元数据校验（正式入口，失败即红）
        run: python scripts/quick_validate.py .

      - name: 打包产物体检（根目录直挂 + 可复现 + 不含隐私）
        run: python scripts/build_skill_zip.py --output dist/skill.zip

  tests-without-zstandard:
    # 可选依赖装不上时不能整仓崩掉：这组刻意只装 dev，验证 5 个依赖 zstandard 的
    # 用例被 skip 时其余全绿。跳过是预期行为，不是掩盖失败。
    name: py${{ matrix.python }} / dev only（无 zstandard）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（仅 dev，不含 zstandard）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("zstandard") is not None:
              sys.exit("zstandard 意外可导入，本 job 的前提不成立")
          print("已确认环境无 zstandard")
          PY

      - name: 全量测试（精确校验 zstd 与 Windows-only skip）
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --cache-clear -rs 2>&1 | tee pytest-no-zstd.log
          if ! grep -Eq '[0-9]+ passed, 7 skipped' pytest-no-zstd.log; then
            echo "::error::无 zstd 环境应恰好有 5 个 zstd skip + 2 个 Windows-only skip。"
            tail -n 20 pytest-no-zstd.log
            exit 1
          fi
          zstd_skips="$(grep -c 'SKIPPED .*tests/test_codex_adapter.py' pytest-no-zstd.log || true)"
          windows_skips="$(grep -c 'SKIPPED .*tests/test_cli_encoding.py' pytest-no-zstd.log || true)"
          if [ "${zstd_skips}" -ne 5 ] || [ "${windows_skips}" -ne 2 ]; then
            echo "::error::skip 分类不符：zstd=${zstd_skips}（期望 5），Windows-only=${windows_skips}（期望 2）。"
            grep -E '^SKIPPED' pytest-no-zstd.log || true
            exit 1
          fi
          unexpected_skips="$(grep -E '^SKIPPED' pytest-no-zstd.log | grep -Fv -e 'tests/test_codex_adapter.py' -e 'tests/test_cli_encoding.py' || true)"
          if [ -n "${unexpected_skips}" ]; then
            echo "::error::无 zstd 环境出现了预期分类之外的 skip。"
            echo "${unexpected_skips}"
            exit 1
          fi

  tests-windows:
    # 项目历史上多次踩到 Windows 专属问题：保留名拒绝（CON/PRN/AUX…）、
    # 状态目录是 junction/符号链接时拒绝删除、_today() 必须取本地日期（东八区）、
    # CRLF 与反斜杠路径处理。ubuntu 上这些分支一条都不会被执行，所以单开一个 job。
    # 矩阵只留 3.11：平台差异与 Python 版本无关，多铺一版只是烧分钟数。
    name: py${{ matrix.python }} / windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（dev + codex）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,codex]"

      - name: 全量测试
        run: python -m pytest -q --cache-clear
