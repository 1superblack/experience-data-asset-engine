[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "experience-data-asset-engine"
version = "1.0.0"
description = "Turn AI conversations and project work into reusable, traceable, governable experience data assets stored as Obsidian notes."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "黑超人" }]
keywords = ["obsidian", "knowledge-base", "experience-asset", "knowledge-distillation", "skill"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
codex = ["zstandard>=0.22"]
dev = ["pytest>=8", "coverage[toml]>=7.4", "ruff>=0.11"]

[project.scripts]
experience-data-asset-engine = "experience_data_asset_engine.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["experience_data_asset_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
